name: Refresh lockfile (temporary)
on:
  push:
    branches: [security/harden-portfolio-20261027]
    paths: [.github/workflows/refresh-lockfile.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Regenerate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify strict reproducible install
        run: npm ci --ignore-scripts
      - name: Commit only regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "fix(ci): synchronize npm lockfile for npm ci"
          git push origin HEAD:security/harden-portfolio-20261027
