name: CI

on:
  push:
    branches: [main, master, "fix/stabilize-green"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Type-Check · Tests · Security · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Type-Check
        run: npx tsc --noEmit

      - name: Tests & Coverage
        run: npx vitest run --coverage

      - name: Security Audit
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build
